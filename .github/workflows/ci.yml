name: Node.js Ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env :
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout into repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Database DATABASE_URL
        run: |
          if [-n "$DATABASE_URL" ];then
            echo "DATABASE_URL loaded success"
          else
            echo "DATABASE_URL missing"
            exit 1
          fi
      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Projects
        run: npm run build
      
